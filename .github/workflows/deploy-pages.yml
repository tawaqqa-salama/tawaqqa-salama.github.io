# نشر منصة توقع سلامة إلى https://tawaqqa-salama.github.io/
# مستودع واحد: الكود هنا، والبناء عبر GitHub Actions
#
# أسرار اختيارية (بدونها وضع تجريبي):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
# انظر docs/SUPABASE.md

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static site
        env:
          USER_PAGES: "true"
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          NEXT_PUBLIC_USER_PAGES: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "::warning::GitHub Pages = واجهة ثابتة فقط. ZATCA/API يحتاج استضافة Node (انظر docs/DEPLOY.md و deploy-node.yml)"
          EXPECTED_REF="ezmdkwgziyencejfevso"
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Production Pages build requires NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY secrets (project ${EXPECTED_REF}). Without them Knowledge Base falls into demo mode and cannot persist."
            exit 1
          fi
          REF="$(echo "$NEXT_PUBLIC_SUPABASE_URL" | sed -E 's#https?://([a-z0-9-]+)\.supabase\.co.*#\1#i')"
          echo "Supabase project ref: ${REF}"
          if [ "$REF" != "$EXPECTED_REF" ]; then
            echo "::error::Unexpected Supabase project ref '${REF}' (expected ${EXPECTED_REF}). Refusing to ship misconfigured Production build."
            exit 1
          fi
          # Demo flags OFF when Production secrets are present — Knowledge Base must not use session-memory fallback.
          export ALLOW_DEMO_MODE=false
          export NEXT_PUBLIC_ALLOW_DEMO_MODE=false
          # إخفاء Route Handlers + middleware أثناء البناء الثابت (output: export)
          # نُبقي robots.txt / sitemap.xml (force-static) لأنهما متوافقان مع التصدير الثابت
          if [ -d app/api ]; then
            mv app/api .api-build-tmp
          fi
          if [ -f middleware.ts ]; then
            mv middleware.ts .middleware-build-tmp.ts
          fi
          npm run build
          if [ -d .api-build-tmp ]; then
            mv .api-build-tmp app/api
          fi
          if [ -f .middleware-build-tmp.ts ]; then
            mv .middleware-build-tmp.ts middleware.ts
          fi
          touch out/.nojekyll


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
