# نشر منصة توقع سلامة إلى https://tawaqqa-salama.github.io/
# مستودع واحد: الكود هنا، والبناء عبر GitHub Actions
#
# أسرار اختيارية (بدونها وضع تجريبي):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
# انظر docs/SUPABASE.md

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static site
        env:
          USER_PAGES: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "Supabase: مفاتيح موجودة — البناء بوضع حقيقي"
          else
            echo "::warning::Supabase غير مربوط — البناء بوضع تجريبي. أضف الأسرار حسب docs/SUPABASE.md"
          fi
          # إخفاء Route Handlers أثناء البناء الثابت (output: export)
          if [ -d app/api ]; then
            mv app/api .api-build-tmp
          fi
          npm run build
          if [ -d .api-build-tmp ]; then
            mv .api-build-tmp app/api
          fi
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
